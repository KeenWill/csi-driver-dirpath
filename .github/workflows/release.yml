name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish; the selected workflow ref supplies the packaging files
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release versions
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${DISPATCH_TAG}"
          else
            release_tag="${REF_TAG}"
          fi
          if [[ "${release_tag}" != v* || "${release_tag}" == "v" ]]; then
            echo "release tag must start with v" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${release_tag}"
          echo "release_tag=${release_tag}" >>"${GITHUB_OUTPUT}"
          echo "chart_version=${release_tag}" >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push driver image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/keenwill/csi-driver-dirpath:${{ steps.version.outputs.release_tag }}
          build-args: |
            VERSION=${{ steps.version.outputs.release_tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3

      - name: Package and push Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          helm package charts/csi-driver-dirpath \
            --destination dist \
            --version "${CHART_VERSION}" \
            --app-version "${RELEASE_TAG}"
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/csi-driver-dirpath-${CHART_VERSION}.tgz" oci://ghcr.io/keenwill
