{{- if not .Values.fence.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "csi-driver-dirpath.fenceSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-driver-dirpath.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.fence.existingSecretKey }}: {{ required "fence.token is required when fence.existingSecret is empty" .Values.fence.token | quote }}
{{- end }}
