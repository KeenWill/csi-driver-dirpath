---
# Source: csi-driver-dirpath/templates/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-driver-dirpath
  namespace: kube-system
  labels:
    helm.sh/chart: csi-driver-dirpath-0.1.0
    app.kubernetes.io/name: csi-driver-dirpath
    app.kubernetes.io/instance: csi-driver-dirpath
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: csi-driver-dirpath
      app.kubernetes.io/instance: csi-driver-dirpath
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csi-driver-dirpath
        app.kubernetes.io/instance: csi-driver-dirpath
      annotations:
        checksum/fence-secret: c5437bc8700430571c5b40dd0b04bb58e462e7354e7fc98482e81b49e013f5aa
    spec:
      serviceAccountName: csi-driver-dirpath
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: dirpath-plugin
          image: ghcr.io/keenwill/csi-driver-dirpath:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_NAME)
            - --base-path=/var/lib/dirpath
            - --fence-token=$(FENCE_TOKEN)
            - --fence-mode=marker
            - --orphan-reclaim=true
            - --orphan-grace-period=10m
            - --reconcile-interval=1m
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FENCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: csi-driver-dirpath-fence
                  key: fence-token
          securityContext:
            privileged: true
          resources:
            {}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-dir
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: base-path
              mountPath: /var/lib/dirpath
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0@sha256:d7138bcc3aa5f267403d45ad4292c95397e421ea17a0035888850f424c7de25d
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.dirpath.dev/csi.sock
          resources:
            {}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: external-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0@sha256:d5e46da8aff7d73d6f00c761dae94472bcda6e78f4f17b3802dc89d44de0111b
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=true
            - --enable-capacity=false
            - --node-deployment=true
            - --node-deployment-immediate-binding=false
            - --strict-topology=true
            - --immediate-topology=false
            - --worker-threads=5
            - --retry-interval-start=1s
            - --retry-interval-max=5s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.dirpath.dev
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: pods-dir
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: base-path
          hostPath:
            path: /var/lib/dirpath
            type: Directory

